[workspace]
resolver = "2"
members = ["core", "app"]
# `cargo test` at the root runs the engine (the app also needs WebKit on Linux).
default-members = ["core"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Ek2100/blockyard"

[profile.release]
# Small, fast binaries.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
