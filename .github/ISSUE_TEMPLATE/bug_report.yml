name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Server software and version
      placeholder: Paper 1.21.10
  - type: input
    id: versions
    attributes:
      label: Blockyard and macOS version
      placeholder: Blockyard 1.2.0, macOS 15.1
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Help → Show Blockyard Logs, and the server console if it's relevant.
      render: text
