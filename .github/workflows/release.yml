name: Release

# Push a tag like v2.0.0 to build Blockyard for Mac, Windows and Linux and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg for Apple Silicon and Intel Macs.
          - { name: mac, os: macos-latest, args: '--target universal-apple-darwin', targets: 'aarch64-apple-darwin,x86_64-apple-darwin', arch: universal }
          - { name: windows, os: windows-latest, args: '--bundles nsis', targets: '', arch: x64 }
          - { name: windows, os: windows-11-arm, args: '--bundles nsis', targets: '', arch: arm64 }
          - { name: linux, os: ubuntu-24.04, args: '--bundles appimage,deb', targets: '', arch: amd64 }
          - { name: linux, os: ubuntu-24.04-arm, args: '--bundles appimage,deb', targets: '', arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - name: Tests first
        run: cargo test -p blockyard-core
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match package.json ($PKG)"; exit 1; fi
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npx tauri build ${{ matrix.args }}
      - name: Collect files
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version")"
          mkdir -p out
          A="${{ matrix.arch }}"
          case "${{ matrix.name }}" in
            mac)
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Blockyard_${V}_universal.dmg" ;;
            windows)
              cp target/release/bundle/nsis/*-setup.exe "out/Blockyard_${V}_${A}-setup.exe"
              cp target/release/[Bb]lockyard.exe "out/Blockyard_${V}_${A}-portable.exe" ;;
            linux)
              cp target/release/bundle/appimage/*.AppImage "out/Blockyard_${V}_${A}.AppImage"
              cp target/release/bundle/deb/*.deb "out/Blockyard_${V}_${A}.deb" ;;
          esac
          cd out && for f in *; do if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: blockyard-${{ matrix.name }}-${{ matrix.arch }}
          path: out/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          node scripts/release-notes.js "$V" > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "Blockyard $V" --notes-file notes.md
