<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blockyard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-drag"></div>
      <div class="brand"><span class="brand-mark"></span>Blockyard</div>
      <div class="side-label">Servers</div>
      <nav id="server-list"></nav>
      <div class="side-footer">
        <button class="btn primary block" id="btn-new">＋ New Server</button>
        <div class="side-footer-row">
          <button class="btn block" id="btn-import">Import Existing…</button>
          <button class="btn icon" id="btn-settings" title="App settings">⚙︎</button>
        </div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="bridge.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="v12.js"></script>
  <script src="v2.js"></script>
</body>
</html>
